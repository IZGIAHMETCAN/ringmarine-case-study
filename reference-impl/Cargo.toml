[package]
name = "payment-patterns"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT"
description = "Reference implementation: constant-time webhook verification and idempotent payment state"
repository = "https://github.com/izgiahmetcan/ringmarine-case-study"

[dependencies]
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
